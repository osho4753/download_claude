services:
  - type: web
    name: media-api
    runtime: docker
    plan: free
    healthCheckPath: /health
    envVars:
      - key: API_KEY
        generateValue: true
      - key: FILE_TTL_HOURS
        value: "24"
      - key: MAX_FILESIZE_MB
        value: "300"
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: SUPABASE_BUCKET
        value: media
      - key: APIFY_TOKEN
        sync: false
      # Render IPs are blocked by YouTube, so don't waste time trying yt-dlp first.
      - key: YOUTUBE_VIA_APIFY
        value: always
      - key: COOKIES_FILE
        value: /etc/secrets/cookies.txt
